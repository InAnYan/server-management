# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json
---
- name: Reboot target hosts safely
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Reboot system and wait for connection recovery
      ansible.builtin.reboot:
        reboot_timeout: 300
        post_reboot_delay: 10
