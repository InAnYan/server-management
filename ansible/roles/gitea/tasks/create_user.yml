---
# Task to create or update a user account in Gitea

- name: Validate required user parameters
  ansible.builtin.assert:
    that:
      - username is defined and (username | length > 0)
      - email is defined and (email | length > 0)
      - password is defined and (password | length > 0)
    fail_msg: "Variables 'username', 'email', and 'password' must be defined and non-empty."

- name: Query existing Gitea users
  ansible.builtin.command:
    cmd: docker exec -u git core-gitea gitea admin user list -c /data/gitea/conf/app.ini
  register: gitea_users_list
  changed_when: false

- name: Determine if target user exists
  ansible.builtin.set_fact:
    user_exists: "{{ gitea_users_list.stdout | regex_search('^[0-9]+\\s+' ~ (username | regex_escape) ~ '\\s+', multiline=True) is not none }}"

- name: Create Gitea user account
  ansible.builtin.command:
    cmd: >
      docker exec -u git core-gitea gitea admin user create
      --username "{{ username }}"
      --password "{{ password }}"
      --email "{{ email }}"
      {{ '--admin' if (is_admin | default(false) | bool) else '' }}
      --must-change-password={{ 'true' if (must_change_password | default(false) | bool) else 'false' }}
      -c /data/gitea/conf/app.ini
  register: gitea_create_res
  when: not user_exists
  changed_when: true

- name: Update existing Gitea user password
  ansible.builtin.command:
    cmd: >
      docker exec -u git core-gitea gitea admin user change-password
      --username "{{ username }}"
      --password "{{ password }}"
      -c /data/gitea/conf/app.ini
  when: user_exists
  changed_when: true
