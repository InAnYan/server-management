---
# Gitea service defaults
gitea_dir: "/opt/gitea"
gitea_image: "gitea/gitea:1.22"
gitea_http_port: 3000
gitea_ssh_port: 2222
gitea_domain: "{{ gitea_domain | default('git.' ~ (dns_zone_name | default('example.com'))) }}"
gitea_admin_user: "{{ gitea_admin_user | default('giteaadmin') }}"
gitea_admin_email: "{{ gitea_admin_email | default('admin@' ~ (dns_zone_name | default('example.com'))) }}"
gitea_admin_password: "{{ lookup('file', '/srv/secrets/gitea_admin_password', errors='ignore') | default(lookup('file', '/srv/admin/gitea_admin_password', errors='ignore'), true) | default(vault_gitea_admin_password | default('ChangeMeGiteaAdminPass123!'), true) | trim }}"

gitea_db_host: "10.10.2.10:5432"
gitea_db_name: "{{ gitea_db_name | default('giteadb') }}"
gitea_db_user: "{{ gitea_db_user | default('gitea') }}"
gitea_db_password: "{{ lookup('file', '/srv/secrets/gitea_db_password', errors='ignore') | default(lookup('file', '/srv/admin/gitea_db_password', errors='ignore'), true) | default(vault_gitea_db_password | default('ChangeMeGiteaDbPass123!'), true) | trim }}"

# Base configuration dictionary
gitea_default_env:
  USER_UID: "1000"
  USER_GID: "1000"
  GITEA__database__DB_TYPE: "postgres"
  GITEA__database__HOST: "{{ gitea_db_host }}"
  GITEA__database__NAME: "{{ gitea_db_name }}"
  GITEA__database__USER: "{{ gitea_db_user }}"
  GITEA__database__PASSWD: "{{ gitea_db_password }}"
  GITEA__database__SSL_MODE: "disable"
  GITEA__server__ROOT_URL: "https://{{ gitea_domain }}/"
  GITEA__server__DOMAIN: "{{ gitea_domain }}"
  GITEA__server__SSH_DOMAIN: "{{ gitea_domain }}"
  GITEA__server__SSH_PORT: "{{ gitea_ssh_port }}"
  GITEA__server__SSH_LISTEN_PORT: "22"
  GITEA__service__DISABLE_REGISTRATION: "true"
  GITEA__security__INSTALL_LOCK: "true"

# Vault or secrets overrides
gitea_custom_env: "{{ vault_gitea_env | default(gitea_env | default({})) }}"
