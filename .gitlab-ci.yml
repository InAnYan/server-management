stages:
  - test
  - secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# Custom job to ensure no forbidden files (tfvars, state, secrets.yml, etc.) are tracked in Git
forbidden-files-check:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache git grep
  script:
    - echo "Checking repository for tracked sensitive files..."
    - |
      VIOLATIONS=$(git ls-files | grep -E '(\.env$|\.env\.|\.tfvars$|\.tfstate|secrets\.yml$|vault\.yml$|id_rsa|id_ed25519|\.pem$|\.key$|\.vault_pass)' | grep -v '\.example$' || true)
      if [ -n "$VIOLATIONS" ]; then
        echo "ERROR: Forbidden sensitive files found in repository:"
        echo "$VIOLATIONS"
        exit 1
      fi
    - echo "No forbidden sensitive files tracked."

# Gitleaks standalone job for comprehensive secret detection
gitleaks-scan:
  stage: secret-detection
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source="." --verbose --redact
