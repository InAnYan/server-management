[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Secrets are stored unencrypted locally in gitignored files (e.g. group_vars/all/secrets.yml).
# If switching back to Ansible Vault in the future, uncomment the line below:
# vault_password_file = ../.vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
