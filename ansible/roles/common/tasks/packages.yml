---
- name: Update apt cache and upgrade system packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
  when: inventory_hostname not in groups['proxmox'] | default([])

- name: Install essential baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Ensure qemu-guest-agent service is started and enabled
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true
  when:
    - inventory_hostname not in groups['proxmox'] | default([])
    - "'qemu-guest-agent' in common_packages"
