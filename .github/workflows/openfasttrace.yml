name: OpenFastTrace

on:
  push:
  pull_request:

jobs:
  trace:
    name: Verify Requirement Tracing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run OpenFastTrace
        uses: itsallcode/openfasttrace-github-action@v0
        with:
          fail-on-error: true
