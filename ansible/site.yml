# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json
---
# Main VM configuration playbook

- name: Apply baseline configuration to all VMs
  hosts: all:!proxmox
  become: true
  roles:
    - role: common
      tags:
        - common

- name: Configure Docker container runtime
  hosts: docker_hosts:!proxmox
  become: true
  roles:
    - role: docker
      tags:
        - docker

- name: Configure Infisical secrets client
  hosts: infisical_hosts:!proxmox
  become: true
  roles:
    - role: infisical
      tags:
        - infisical

- name: Deploy Caddy reverse proxy
  hosts: core_coordinators:!proxmox
  become: true
  roles:
    - role: caddy
      tags:
        - caddy
