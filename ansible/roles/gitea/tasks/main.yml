---
# Gitea service role tasks
# [impl->req~app-accounts-ansible~1]
# [impl->req~git-service-private-authentication-required~1]

- name: Ensure Gitea domain resolves locally in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars['core-coord-caddy'].ansible_host | default('10.10.1.10') }} {{ gitea_domain }}"
    state: present
  tags:
    - gitea
    - git

- name: Configure Docker daemon for local Gitea container registry
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["{{ gitea_domain }}"]
      }
    mode: "0644"
  register: gitea_docker_daemon_config
  tags:
    - gitea
    - git

- name: Restart Docker to apply daemon config
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: gitea_docker_daemon_config.changed
  tags:
    - gitea
    - git

- name: Ensure Gitea base directory exists
  ansible.builtin.file:
    path: "{{ gitea_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - gitea
    - git

- name: Ensure Gitea data directory exists
  ansible.builtin.file:
    path: "{{ gitea_dir }}/data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  tags:
    - gitea
    - git

- name: Deploy Gitea Docker Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  register: gitea_compose_file_result
  tags:
    - gitea
    - git

- name: Ensure Gitea runner data directory exists
  ansible.builtin.file:
    path: "{{ gitea_dir }}/runner_data"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: enable_gitea_actions | default(true) | bool
  tags:
    - gitea
    - git

- name: Deploy Gitea act_runner configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ gitea_dir }}/runner_data/config.yaml"
    owner: root
    group: root
    mode: "0644"
  when: enable_gitea_actions | default(true) | bool
  tags:
    - gitea
    - git

- name: Pull and start Gitea container
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ gitea_dir }}"
  register: gitea_compose_result
  changed_when: "'Started' in gitea_compose_result.stdout or 'Recreated' in gitea_compose_result.stdout or 'Pulling' in gitea_compose_result.stdout"
  tags:
    - gitea
    - git

- name: Wait for Gitea Web UI to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitea_http_port }}/"
    status_code:
      - 200
      - 302
    return_content: false
  register: gitea_health
  until: gitea_health.status in [200, 302]
  retries: 30
  delay: 3
  tags:
    - gitea
    - git

- name: Setup or rotate Gitea administrator account
  ansible.builtin.include_tasks: setup_admin.yml
  tags:
    - gitea
    - git

# [impl->req~gitops-ci-cd-platform~1]
- name: Setup Gitea utility bot user and tokens
  ansible.builtin.include_tasks: setup_utility.yml
  tags:
    - gitea
    - git

- name: Ensure platform service data directories exist
  ansible.builtin.file:
    path: "{{ gitea_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - runner_data
    - atlantis_data
  tags:
    - gitea
    - git

- name: Re-deploy Gitea Docker Compose configuration with platform services
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  register: gitea_compose_update
  tags:
    - gitea
    - git

- name: Ensure all Gitea platform services are running
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ gitea_dir }}"
  register: gitea_services_result
  changed_when: "'Started' in gitea_services_result.stdout or 'Recreated' in gitea_services_result.stdout"
  when: gitea_compose_update.changed
  tags:
    - gitea
    - git

# [impl->req~app-accounts-ansible~1]
- name: Query configured authentication sources in Gitea
  ansible.builtin.command:
    cmd: docker exec -u git core-gitea gitea admin auth list
  register: gitea_auth_sources
  changed_when: false
  when: gitea_oidc_enabled | default(true) | bool
  tags:
    - gitea
    - sso

- name: Register Authentik OpenID Connect authentication source in Gitea
  ansible.builtin.command:
    cmd: >-
      docker exec -u git core-gitea gitea admin auth add-oauth
      --name authentik
      --provider openidConnect
      --key {{ gitea_oidc_client_id }}
      --secret '{{ gitea_oidc_client_secret }}'
      --auto-discover-url {{ gitea_oidc_discover_url }}
      --scopes openid
      --scopes email
      --scopes profile
      --admin-group admins
      --group-claim-name groups
  when:
    - gitea_oidc_enabled | default(true) | bool
    - gitea_oidc_client_secret | default('') | length > 0
    - "'authentik' not in (gitea_auth_sources.stdout | default(''))"
  tags:
    - gitea
    - sso

- name: Update Authentik OpenID Connect authentication scopes in Gitea
  ansible.builtin.command:
    cmd: >-
      docker exec -u git core-gitea gitea admin auth update-oauth
      --id {{ (gitea_auth_sources.stdout_lines | select('search', 'authentik') | first).split()[0] | default(1) }}
      --scopes openid
      --scopes email
      --scopes profile
      --admin-group admins
      --group-claim-name groups
  when:
    - gitea_oidc_enabled | default(true) | bool
    - "'authentik' in (gitea_auth_sources.stdout | default(''))"
  tags:
    - gitea
    - sso
