# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json
---
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - infisical

- name: Download Infisical official GPG key
  ansible.builtin.get_url:
    url: https://artifacts-cli.infisical.com/infisical.gpg
    dest: /etc/apt/keyrings/infisical.asc
    mode: "0644"
    force: false
  tags:
    - infisical

- name: Add Infisical APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/infisical.asc] https://artifacts-cli.infisical.com/deb stable main"
    state: present
    filename: infisical
  tags:
    - infisical

- name: Install Infisical CLI package
  ansible.builtin.apt:
    name: "{{ infisical_package }}"
    state: present
    update_cache: true
  tags:
    - infisical
