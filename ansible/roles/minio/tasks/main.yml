---
# MinIO S3 object storage role tasks
# [impl->req~object-storage-service~1]
# [impl->req~configuration-ansible~1]

- name: Ensure MinIO root configuration directory exists
  ansible.builtin.file:
    path: "{{ minio_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - minio

- name: Ensure MinIO data and client directories exist with proper container permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "65532"
    group: "65532"
    mode: "0750"
  loop:
    - "{{ minio_dir }}/data"
    - "{{ minio_dir }}/.mc"
  tags:
    - minio

# [impl->req~in-ram-container-secrets~1]
- name: Ensure RAM-backed secret directory exists for MinIO
  ansible.builtin.file:
    path: /dev/shm/minio
    state: directory
    owner: "65532"
    group: "65532"
    mode: "0700"
  tags:
    - minio

- name: Inject MinIO root password into RAM tmpfs
  ansible.builtin.copy:
    dest: /dev/shm/minio/minio_root_password
    content: "{{ minio_root_password }}"
    owner: "65532"
    group: "65532"
    mode: "0400"
  no_log: true
  tags:
    - minio

- name: Deploy MinIO Docker Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ minio_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  register: minio_compose_file_result
  tags:
    - minio

# [impl->req~databases-isolated-from-internet~1]
- name: Check if MinIO image exists locally in Docker
  ansible.builtin.command:
    cmd: "docker image inspect {{ minio_image }}"
  register: minio_image_check
  failed_when: false
  changed_when: false
  tags:
    - minio

- name: Pre-fetch and transfer MinIO image for isolated nodes
  when:
    - not (node_has_internet | default(true) | bool)
    - minio_image_check.rc != 0
  tags:
    - minio
  block:
    - name: Ensure controller images cache directory exists
      ansible.builtin.file:
        path: /srv/admin/images
        state: directory
        owner: root
        group: root
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Check available image pre-fetch tool on controller
      ansible.builtin.command:
        cmd: which skopeo
      register: skopeo_check
      failed_when: false
      changed_when: false
      delegate_to: localhost
      run_once: true

    - name: Pre-fetch MinIO image archive using skopeo
      ansible.builtin.command:
        cmd: >
          skopeo copy --override-os linux --override-arch amd64
          docker://{{ minio_image }}
          docker-archive:/srv/admin/images/minio-{{ minio_image | regex_replace('[:/]', '_') }}.tar:{{ minio_image }}
      delegate_to: localhost
      run_once: true
      args:
        creates: "/srv/admin/images/minio-{{ minio_image | regex_replace('[:/]', '_') }}.tar"
      when: skopeo_check.rc == 0

    - name: Pre-fetch MinIO image archive using docker
      ansible.builtin.shell:
        cmd: >
          docker pull {{ minio_image }} &&
          docker save {{ minio_image }} -o /srv/admin/images/minio-{{ minio_image | regex_replace('[:/]', '_') }}.tar
      delegate_to: localhost
      run_once: true
      args:
        creates: "/srv/admin/images/minio-{{ minio_image | regex_replace('[:/]', '_') }}.tar"
      when: skopeo_check.rc != 0

    - name: Transfer MinIO image archive to target VM
      ansible.builtin.copy:
        src: "/srv/admin/images/minio-{{ minio_image | regex_replace('[:/]', '_') }}.tar"
        dest: "/tmp/minio-image.tar"
        mode: "0644"

    - name: Load MinIO image into target Docker daemon
      ansible.builtin.command:
        cmd: "docker load -i /tmp/minio-image.tar"

    - name: Clean up temporary image archive on target VM
      ansible.builtin.file:
        path: "/tmp/minio-image.tar"
        state: absent

- name: Pull and start MinIO container
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ minio_dir }}"
  register: minio_compose_result
  changed_when: "'Started' in minio_compose_result.stdout or 'Recreated' in minio_compose_result.stdout or 'Pulling' in minio_compose_result.stdout"
  tags:
    - minio

- name: Wait for MinIO health endpoint to respond
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ minio_api_port }}/minio/health/live"
    status_code: 200
    return_content: false
  register: minio_health
  until: minio_health.status == 200
  retries: 20
  delay: 2
  tags:
    - minio

- name: Deploy MinIO Client (mc) wrapper script
  ansible.builtin.copy:
    dest: /usr/local/bin/mc
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      exec docker run --rm -i --network host -v {{ minio_dir }}/.mc:/home/nonroot/.mc -v /tmp:/tmp:ro {{ minio_mc_image }} "$@"
  tags:
    - minio

- name: Configure local MinIO Client alias
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/mc alias set local
      http://127.0.0.1:{{ minio_api_port }}
      {{ minio_root_user }}
      {{ minio_root_password }}
  changed_when: false
  tags:
    - minio
