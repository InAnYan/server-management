# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json
---
# [impl->req~secrets-rotation-ansible~1]
- name: Suspend public ingress on Caddy (maintenance mode)
  hosts: core-coord-caddy
  become: true
  tasks:
    - name: Enable maintenance mode for public sites
      ansible.builtin.template:
        src: ../../roles/caddy/templates/site.Caddyfile.j2
        dest: "{{ caddy_dir | default('/opt/caddy') }}/conf.d/{{ item.name }}.Caddyfile"
        owner: root
        group: root
        mode: "0644"
      vars:
        item: "{{ site_item | combine({'maintenance': true}) }}"
      loop: "{{ caddy_sites | default([]) }}"
      loop_control:
        loop_var: site_item

    - name: Reload Caddy to activate maintenance mode
      ansible.builtin.command:
        cmd: docker compose exec -w /etc/caddy caddy caddy reload --config /etc/caddy/Caddyfile
        chdir: "{{ caddy_dir | default('/opt/caddy') }}"
      changed_when: true

- name: Setup or rotate PostgreSQL administrator password
  hosts: core-data-postgres
  become: true
  tasks:
    - name: Run PostgreSQL administrator credential setup
      ansible.builtin.include_role:
        name: postgres
        tasks_from: setup_admin.yml

- name: Setup or rotate Technitium administrator password
  hosts: core-app-technitium
  become: true
  tasks:
    - name: Run Technitium administrator credential setup
      ansible.builtin.include_role:
        name: technitium
        tasks_from: setup_admin.yml

- name: Setup or rotate Uptime Kuma administrator account
  hosts: core-coord-uptimekuma
  become: true
  tasks:
    - name: Run Uptime Kuma administrator credential setup
      ansible.builtin.include_role:
        name: uptimekuma
        tasks_from: setup_admin.yml

- name: Restore public ingress on Caddy
  hosts: core-coord-caddy
  become: true
  tasks:
    - name: Disable maintenance mode for public sites
      ansible.builtin.template:
        src: ../../roles/caddy/templates/site.Caddyfile.j2
        dest: "{{ caddy_dir | default('/opt/caddy') }}/conf.d/{{ item.name }}.Caddyfile"
        owner: root
        group: root
        mode: "0644"
      vars:
        item: "{{ site_item | combine({'maintenance': false}) }}"
      loop: "{{ caddy_sites | default([]) }}"
      loop_control:
        loop_var: site_item

    - name: Reload Caddy to restore public traffic
      ansible.builtin.command:
        cmd: docker compose exec -w /etc/caddy caddy caddy reload --config /etc/caddy/Caddyfile
        chdir: "{{ caddy_dir | default('/opt/caddy') }}"
      changed_when: true
