# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json
---
# [impl->req~reverse-proxy-ansible~1]
- name: Ensure Caddy configuration and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ caddy_dir }}"
    - "{{ caddy_dir }}/conf.d"
    - "{{ caddy_dir }}/data"
    - "{{ caddy_dir }}/config"
  tags:
    - caddy

- name: Deploy Caddy configuration file
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: caddy_config_result
  tags:
    - caddy

- name: Deploy Caddy Docker Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  register: caddy_compose_file_result
  tags:
    - caddy

- name: Pull and start Caddy container
  ansible.builtin.command:
    cmd: docker compose up -d --pull missing --remove-orphans
    chdir: "{{ caddy_dir }}"
  register: caddy_compose_result
  changed_when: "'Started' in caddy_compose_result.stdout or 'Recreated' in caddy_compose_result.stdout or 'Pulling' in caddy_compose_result.stdout"
  tags:
    - caddy

- name: Extract Caddy internal root CA certificate to controller secrets
  ansible.builtin.shell:
    cmd: "docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt"
    chdir: "{{ caddy_dir }}"
  register: caddy_root_ca_raw
  changed_when: false
  tags:
    - caddy

- name: Save Caddy root CA certificate to local secrets store
  ansible.builtin.copy:
    content: "{{ caddy_root_ca_raw.stdout }}"
    dest: /srv/admin/secrets/caddy_root.crt
    owner: "{{ host_admin_user | default('ruslan') }}"
    group: sudo
    mode: "0644"
  delegate_to: localhost
  when: caddy_root_ca_raw.stdout is defined and caddy_root_ca_raw.stdout | length > 0
  tags:
    - caddy

- name: Deploy modular Caddy site definitions
  ansible.builtin.template:
    src: site.Caddyfile.j2
    dest: "{{ caddy_dir }}/conf.d/{{ item.name }}.Caddyfile"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ (caddy_sites | default([])) + ([caddy_site] if caddy_site is defined else []) }}"
  when: item.enabled | default(true) | bool
  register: caddy_sites_result
  tags:
    - caddy

- name: Remove disabled Caddy site definitions
  ansible.builtin.file:
    path: "{{ caddy_dir }}/conf.d/{{ item.name }}.Caddyfile"
    state: absent
  loop: "{{ (caddy_sites | default([])) + ([caddy_site] if caddy_site is defined else []) }}"
  when: not (item.enabled | default(true) | bool)
  register: caddy_disabled_sites_result
  tags:
    - caddy

- name: Reload Caddy configuration if Caddyfile or site definitions changed
  ansible.builtin.command:
    cmd: docker compose exec -w /etc/caddy caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ caddy_dir }}"
  when:
    - (caddy_config_result.changed or (caddy_sites_result.changed | default(false)) or (caddy_disabled_sites_result.changed | default(false)))
    - not caddy_compose_result.changed
  changed_when: true
  tags:
    - caddy
