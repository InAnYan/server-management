stages:
  - test
  - secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# Lint Markdown files whenever markdown files are modified
markdownlint:
  stage: test
  image: node:20-alpine
  rules:
    - changes:
        - "**/*.md"
        - ".markdownlint.json"
        - ".gitlab-ci.yml"
  script:
    - npx -y markdownlint-cli "**/*.md"

# Gitleaks standalone job for comprehensive secret detection
gitleaks-scan:
  stage: secret-detection
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source="." --verbose --redact
