name: Secret Detection

on:
  push:
  pull_request:

jobs:
  scan-secrets:
    name: Scan for Published Secrets & Sensitive Files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify No Forbidden Sensitive Files Exist in Repo
        run: |
          echo "Checking tracked files for sensitive patterns..."
          VIOLATIONS=$(git ls-files | grep -E '(\.env$|\.env\.|\.tfvars$|\.tfstate|secrets\.yml$|vault\.yml$|id_rsa|id_ed25519|\.pem$|\.key$|\.vault_pass)' | grep -v '\.example$' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Tracked sensitive files detected in repository:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No forbidden sensitive files tracked."
