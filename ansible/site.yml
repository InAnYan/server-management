---
# Main VM configuration playbook

- name: Apply baseline configuration to all VMs
  hosts: all
  become: true
  roles:
    - role: common
      tags:
        - common

- name: Configure Docker container runtime
  hosts: docker_hosts
  become: true
  roles:
    - role: docker
      tags:
        - docker

- name: Configure Infisical secrets client
  hosts: infisical_hosts
  become: true
  roles:
    - role: infisical
      tags:
        - infisical
