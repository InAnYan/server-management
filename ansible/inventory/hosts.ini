# Core infrastructure inventory
# Hostnames follow <category>-<subcategory>-<name> per docs/naming.md

[proxmox]
localhost ansible_connection=local

# Tiered VM groups matching docs/networking.md and docs/naming.md
[core_coordinators]
core-coord-caddy        ansible_host=10.10.1.10
core-coord-uptimekuma   ansible_host=10.10.1.11
core-coord-gitea        ansible_host=10.10.1.12

[core_apps]
core-app-technitium     ansible_host=10.11.0.10

[core_databases]
core-data-postgres      ansible_host=10.10.2.10

[dev_apps]

[dev_databases]
dev-data-postgres       ansible_host=10.20.2.10

[prod_apps]

[prod_databases]
prod-data-postgres      ansible_host=10.30.2.10

# Role assignment groups
[docker_hosts:children]
core_coordinators
core_apps
core_databases
dev_apps
dev_databases
prod_apps
prod_databases

[vms:children]
core_coordinators
core_apps
core_databases
dev_apps
dev_databases
prod_apps
prod_databases

[vms:vars]
ansible_user=ansible
ansible_ssh_private_key_file=../secrets/id_ansible
ansible_python_interpreter=/usr/bin/python3
