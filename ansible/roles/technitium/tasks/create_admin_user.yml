---
- name: Validate Technitium new administrator parameters
  ansible.builtin.assert:
    that:
      - admin_username is defined and (admin_username | length > 0)
      - admin_password is defined and (admin_password | length > 0)
    fail_msg: "Both 'admin_username' and 'admin_password' must be specified."

- name: Retrieve Technitium API token
  ansible.builtin.set_fact:
    active_technitium_token: "{{ lookup('file', '/srv/secrets/technitium_api_token', errors='ignore') | default(technitium_token | default(''), true) | trim }}"

- name: Authenticate session to obtain token if API token is not available
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port | default(80) }}/api/user/login?user={{ technitium_admin_user | default('admin') }}&pass={{ technitium_admin_password }}"
    method: GET
    return_content: true
  register: technitium_auth_resp
  when: active_technitium_token | length == 0

- name: Set token from login response if newly authenticated
  ansible.builtin.set_fact:
    active_technitium_token: "{{ technitium_auth_resp.json.token }}"
  when:
    - active_technitium_token | length == 0
    - technitium_auth_resp.json is defined
    - technitium_auth_resp.json.token is defined

- name: Check if Technitium user already exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port | default(80) }}/api/admin/users/get?token={{ active_technitium_token }}&user={{ admin_username }}"
    method: GET
    return_content: true
  register: technitium_user_get
  failed_when: false

- name: Create new user in Technitium DNS
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port | default(80) }}/api/admin/users/create?token={{ active_technitium_token }}"
    method: POST
    body_format: form-urlencoded
    body:
      user: "{{ admin_username }}"
      pass: "{{ admin_password }}"
      displayName: "{{ admin_display_name | default(admin_username) }}"
    return_content: true
    status_code:
      - 200
  register: technitium_create_resp
  when: technitium_user_get.json is not defined or technitium_user_get.json.status != 'ok'

- name: Update password if Technitium user already exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port | default(80) }}/api/admin/users/set?token={{ active_technitium_token }}"
    method: POST
    body_format: form-urlencoded
    body:
      user: "{{ admin_username }}"
      newPass: "{{ admin_password }}"
    return_content: true
  when:
    - technitium_user_get.json is defined
    - technitium_user_get.json.status == 'ok'

- name: Ensure Technitium user belongs to Administrators super-group
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port | default(80) }}/api/admin/users/set?token={{ active_technitium_token }}&user={{ admin_username }}&memberOfGroups=Administrators"
    method: GET
    return_content: true
