---
dns_dir: "/opt/technitium"
dns_image: "technitium/dns-server:latest"
dns_http_port: 80
dns_port: 53
dns_domain: "{{ dns_domain }}"
dns_zone_name: "{{ dns_zone_name }}"
dns_admin_password: "{{ lookup('file', '/srv/admin/secrets/dns_admin_password', errors='ignore') | default(lookup('file', '/srv/admin/secrets/powerdns_api_key', errors='ignore')) | trim }}"
dns_public_ip: "{{ server_public_ip }}"
dns_upstream_resolvers:
  - "1.1.1.1"
  - "8.8.8.8"

# OIDC Single Sign-On Configuration for Technitium
dns_oidc_enabled: true
dns_oidc_issuer: "https://{{ auth_domain }}/application/o/dns/"
dns_oidc_client_id: "dns"
dns_oidc_client_secret: "{{ lookup('file', '/srv/admin/secrets/dns_oidc_client_secret', errors='ignore') | default(lookup('file', '/srv/admin/secrets/powerdns_oidc_client_secret', errors='ignore')) | trim }}"

# Default DNS records
dns_default_records:
  - name: ""
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "*"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "ns1"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "git"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "dns"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "status"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "status-dev"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "status-internal"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "auth"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "logs"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "s3"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "s3-console"
    type: "A"
    content: "{{ dns_public_ip }}"
  - name: "infisical"
    type: "A"
    content: "{{ dns_public_ip }}"
