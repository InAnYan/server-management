# ==============================================================================
# Custom Infrastructure Inventory for Downstream Forks
# ==============================================================================
# Add downstream/custom nodes to their respective tier groups below.
# Downstream VM IP addresses must follow the conventions in docs/conventions/networking.md:
#   - In fixed /24 subnets (10.10.1.0/24, 10.10.2.0/24, etc.): use .100 through .254
#   - In wider /16 subnets (10.11.0.0/16, 10.21.0.0/16, 10.32.0.0/16): use 10.x.2.0/24 through 10.x.255.0/24
#
# Examples:
# [core_apps]
# core-app-vaultwarden ansible_host=10.11.2.10
#
# [dev_apps]
# dev-app-myapi        ansible_host=10.21.2.10
#
# [prod_apps]
# prod-app-myapi       ansible_host=10.32.2.10
