---
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - docker

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false
  environment: "{{ {'http_proxy': 'http://' ~ ansible_default_ipv4.gateway ~ ':8888', 'https_proxy': 'http://' ~ ansible_default_ipv4.gateway ~ ':8888'} if not (node_has_internet | default(true) | bool) else {} }}"
  tags:
    - docker

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  tags:
    - docker

- name: Install Docker and Docker Compose packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  tags:
    - docker

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  tags:
    - docker

- name: Add operational users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  tags:
    - docker

- name: Ensure systemd docker drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not (node_has_internet | default(true) | bool)
  tags:
    - docker

- name: Configure Docker daemon proxy for isolated nodes
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    content: |
      [Service]
      Environment="HTTP_PROXY=http://{{ ansible_default_ipv4.gateway }}:8888"
      Environment="HTTPS_PROXY=http://{{ ansible_default_ipv4.gateway }}:8888"
      Environment="NO_PROXY=localhost,127.0.0.1,10.0.0.0/8"
    owner: root
    group: root
    mode: "0644"
  register: docker_proxy_conf
  when: not (node_has_internet | default(true) | bool)
  tags:
    - docker

- name: Reload systemd daemon and restart docker if docker proxy config changed
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when:
    - not (node_has_internet | default(true) | bool)
    - docker_proxy_conf.changed
  tags:
    - docker

- name: Ensure Docker and containerd services are running and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - containerd
    - docker
  tags:
    - docker
