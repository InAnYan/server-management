---
- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: restarted

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
