---
# Variables for core coordinator hosts (e.g. core-coord-caddy)
caddy_sites:
  - name: technitium
    domain: "{{ technitium_domain }}"
    host: core-app-technitium
    port: 80
    enabled: "{{ enable_technitium | default(true) }}"
  - name: uptimekuma
    domain: "{{ uptimekuma_domain }}"
    host: core-coord-uptimekuma
    port: 3001
    enabled: true
  - name: gitea
    domain: "{{ gitea_domain }}"
    host: core-coord-gitea
    port: 3000
    enabled: true
  - name: minio
    domain: "{{ minio_domain }}"
    host: core-data-minio
    port: 9000
    enabled: "{{ enable_minio_core | default(false) }}"
  - name: minio-console
    domain: "{{ minio_console_domain }}"
    host: core-data-minio
    port: 9001
    enabled: "{{ enable_minio_core | default(false) }}"
