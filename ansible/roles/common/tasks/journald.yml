---
- name: Ensure persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Ensure journald drop-in configuration directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent journal logging and retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/01-retention.conf
    content: |
      # Managed by Ansible - do not edit manually
      [Journal]
      Storage=persistent
      MaxRetentionSec=7day
      SystemMaxUse={{ journal_system_max_use }}
      SystemKeepFree={{ journal_system_keep_free }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald
